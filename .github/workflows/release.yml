name: Android release

on:
  schedule:
    - cron: '*/5 * * * *'
  push:
    branches:
      - main
    paths:
      - '.github/release-version'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
    steps:
      - name: Preuzmi izvorni kod
        uses: actions/checkout@v4

      - name: Postavi Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Provjeri oznaku i verziju
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG_NAME="$(tr -d '[:space:]' < .github/release-version)"
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          ANDROID_VERSION="$(sed -n 's/^[[:space:]]*versionName[[:space:]]*"\([^"]*\)"/\1/p' android/app/build.gradle)"

          if [[ ! "$TAG_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Oznaka $TAG_NAME nije stabilna verzija oblika v1.2.3."
            exit 1
          fi

          if [[ "$TAG_NAME" != "v$PACKAGE_VERSION" ]]; then
            echo "Oznaka $TAG_NAME ne odgovara package.json verziji v$PACKAGE_VERSION."
            exit 1
          fi

          if [[ "$ANDROID_VERSION" != "$PACKAGE_VERSION" ]]; then
            echo "Android verzija $ANDROID_VERSION ne odgovara package.json verziji $PACKAGE_VERSION."
            exit 1
          fi

          echo "TAG_NAME=$TAG_NAME" >> "$GITHUB_ENV"
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            echo "SHOULD_RELEASE=false" >> "$GITHUB_ENV"
            echo "Izdanje $TAG_NAME već postoji; nema ponovne objave."
          else
            echo "SHOULD_RELEASE=true" >> "$GITHUB_ENV"
          fi

      - name: Postavi Java 21
        if: env.SHOULD_RELEASE == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Postavi Android alate
        if: env.SHOULD_RELEASE == 'true'
        uses: android-actions/setup-android@v3

      - name: Postavi Android SDK 35
        if: env.SHOULD_RELEASE == 'true'
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Instaliraj ovisnosti i pokreni testove
        if: env.SHOULD_RELEASE == 'true'
        run: |
          npm ci --ignore-scripts
          npm test

      - name: Izradi Android release
        if: env.SHOULD_RELEASE == 'true'
        run: |
          npm run cap:sync
          cd android
          ./gradlew assembleRelease

      - name: Potpiši APK
        if: env.SHOULD_RELEASE == 'true' && env.ANDROID_KEYSTORE_BASE64 != '' && env.ANDROID_KEYSTORE_PASSWORD != '' && env.ANDROID_KEY_ALIAS != ''
        run: |
          mkdir -p release
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > release/release-key.jks
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -p -f 4 android/app/build/outputs/apk/release/app-release-unsigned.apk release/aligned.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign --ks release/release-key.jks --ks-key-alias "$ANDROID_KEY_ALIAS" --ks-pass env:ANDROID_KEYSTORE_PASSWORD --out "release/Moja_potrosnja_struje-${TAG_NAME}.apk" release/aligned.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "release/Moja_potrosnja_struje-${TAG_NAME}.apk"

      - name: Stvori oznaku izdanja
        if: env.SHOULD_RELEASE == 'true' && env.ANDROID_KEYSTORE_BASE64 != '' && env.ANDROID_KEYSTORE_PASSWORD != '' && env.ANDROID_KEY_ALIAS != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG_NAME}" >/dev/null 2>&1; then
            gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" -f ref="refs/tags/${TAG_NAME}" -f sha="${GITHUB_SHA}"
          fi

      - name: Objavi GitHub izdanje
        if: env.SHOULD_RELEASE == 'true' && env.ANDROID_KEYSTORE_BASE64 != '' && env.ANDROID_KEYSTORE_PASSWORD != '' && env.ANDROID_KEY_ALIAS != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK="release/Moja_potrosnja_struje-${TAG_NAME}.apk"
          gh release create "$TAG_NAME" "$APK" --verify-tag --title "$TAG_NAME" --generate-notes
